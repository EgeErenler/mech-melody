name: judge songs
# Whisper listens to each built song's lead voice and lists the words it cannot make out.
on:
  workflow_dispatch:
    inputs:
      slugs: { description: "songs, space separated", required: true }
jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: mech/requirements.txt }
      - run: mech/ci/setup-tools.sh
      - run: for s in ${{ inputs.slugs }}; do python3 -m mech build "$s"; done
      - run: pip install -q faster-whisper==1.2.1
      - run: python3 tools/asr/sung_words.py ${{ inputs.slugs }}
      - uses: actions/upload-artifact@v4
        with: { name: judge, path: out/judge }
