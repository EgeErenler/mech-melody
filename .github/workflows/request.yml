name: song request
# A JSON file pushed to requests/ (see requests/README.md): hear it, arrange it, film a preview.
on:
  push:
    branches: [main]
    paths: ["requests/*.json"]
permissions:
  contents: write
concurrency: { group: publish, cancel-in-progress: false }
jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CHROME_PATH: /usr/bin/google-chrome
      WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'medium' }}
      PRIVATE: ${{ github.event.repository.private }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: which
        run: |
          f=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'requests/*.json' | head -1)
          echo "file=$f" >> "$GITHUB_OUTPUT"
          echo "request: $f"
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: "mech/requirements*.txt" }
      - name: tools
        run: |
          mech/ci/setup-tools.sh
          mech/ci/setup-listen.sh
      - name: hear, arrange, film
        env: { REQ: "${{ steps.which.outputs.file }}" }
        run: |
          eval "$(python3 - <<'PY'
          import json, os, shlex
          r = json.load(open(os.environ["REQ"]))
          for k, d in (("audio_url", ""), ("slug", ""), ("title", ""), ("artist", ""), ("start", "auto"), ("length", 59), ("arrangement", "band"), ("lang", "auto"), ("voice", "auto")):
              print(f"R_{k.upper()}={shlex.quote(str(r.get(k, d)))}")
          PY
          )"
          python3 mech/ci/fetch_audio.py "$R_AUDIO_URL" work/source
          python3 -m mech listen work/source "$R_SLUG" --start "$R_START" --length "$R_LENGTH" --title "$R_TITLE" --artist "$R_ARTIST" \
            --lang "$R_LANG" --arrangement "$R_ARRANGEMENT" --voice "$R_VOICE"
          python3 -m mech publish "$R_SLUG" --dry-run
          echo "SLUG=$R_SLUG" >> "$GITHUB_ENV"
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: preview, path: "out/*/*", retention-days: 14, if-no-files-found: ignore }
      - name: keep the arrangement and the preview (private repos only)
        if: env.PRIVATE == 'true'
        run: |
          git config user.name "mech.melody bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "songs/$SLUG" && git commit -qm "arrangement: $SLUG" && git pull -q --rebase && git push -q
          mkdir /tmp/pv && cp out/$SLUG/reel.mp4 out/$SLUG/cover.jpg out/$SLUG/caption.txt /tmp/pv/ 2>/dev/null || true
          cp songs/$SLUG/song.yaml /tmp/pv/ ; cd /tmp/pv && git init -q -b previews && git add . && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "preview $SLUG"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" previews
