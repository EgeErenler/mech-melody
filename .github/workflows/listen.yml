name: listen to a song
# Give it a recording: it separates the stems, transcribes notes and words, writes the robots'
# arrangement to songs/<slug>/ and (optionally) films and posts it right away.
on:
  workflow_dispatch:
    inputs:
      audio_url: { description: "direct link to the audio (mp3/wav/m4a; a Google Drive or Dropbox share link works)", required: true }
      slug: { description: "short name for the folder, e.g. tarkan-simarik", required: true }
      title: { description: "song title", required: true }
      artist: { description: "artist", required: true }
      start: { description: "start at (seconds), or auto = the strongest stretch (the chorus)", default: "auto" }
      length: { description: "clip length in seconds (30-90 makes a good Reel)", default: "59" }
      arrangement: { description: "band = robots with instruments, acapella = voices only", type: choice, options: [band, acapella], default: band }
      lang: { description: "language of the words (auto, tr, en, es, fr, …)", default: "auto" }
      voice: { description: "lead robot voice", type: choice, options: [auto, female, male, child], default: auto }
      post_now: { description: "post it as soon as it is made", type: boolean, default: false }
permissions:
  contents: write
  issues: write
concurrency: { group: publish, cancel-in-progress: false }
jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_API: ${{ vars.IG_API || 'instagram' }}
      MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
      GH_TOKEN: ${{ github.token }}
      CHROME_PATH: /usr/bin/google-chrome
      WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'medium' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: "mech/requirements*.txt" }
      - name: tools
        run: |
          mech/ci/setup-tools.sh
          mech/ci/setup-listen.sh
      - name: fetch the recording
        env: { URL: "${{ inputs.audio_url }}" }
        run: python3 mech/ci/fetch_audio.py "$URL" work/source
      - name: listen
        run: |
          python3 -m mech listen work/source "${{ inputs.slug }}" --start "${{ inputs.start }}" --length "${{ inputs.length }}" \
            --title "${{ inputs.title }}" --artist "${{ inputs.artist }}" --lang "${{ inputs.lang }}" \
            --arrangement "${{ inputs.arrangement }}" --voice "${{ inputs.voice }}"
      - name: film it
        run: |
          if [ "${{ inputs.post_now }}" = "true" ]; then python3 -m mech publish "${{ inputs.slug }}"; else python3 -m mech publish "${{ inputs.slug }}" --dry-run; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: "${{ inputs.slug }}", path: "out/*/*", retention-days: 14, if-no-files-found: ignore }
      - name: keep the arrangement
        run: |
          git add "songs/${{ inputs.slug }}"
          mech/ci/commit-state.sh "listened to ${{ inputs.title }}" || true
          git diff --cached --quiet || true
          mech/ci/queue-issue.sh
