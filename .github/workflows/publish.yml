name: publish a reel
# Every hour: if a song in data/schedule.json is due (its time has come, the last post is 3 h old,
# and it is between 09:00 and midnight in London), post it. Videos rendered ahead by the
# "prerender" workflow are used as they are; otherwise the song is built and filmed here.
# With nothing scheduled, POST_HOUR (UTC, default 17) posts the next song in songs/ once a day.
on:
  schedule:
    - cron: "7 8-23 * * *"   # hourly through the London day: slots are London hours (12,15,18,21), so BST and GMT both land
  workflow_dispatch:
    inputs:
      slug: { description: "song folder to post now (empty: whatever is due)", required: false, default: "" }
      dry_run: { description: "make the video but do not post", type: boolean, default: false }
permissions:
  contents: write
  issues: write
concurrency: { group: publish, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_API: ${{ vars.IG_API || 'instagram' }}
      MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
      MIN_GAP_HOURS: ${{ vars.MIN_GAP_HOURS || '3' }}
      POST_WINDOW: ${{ vars.POST_WINDOW || '9-24' }}
      GH_TOKEN: ${{ github.token }}
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - name: anything to post?
        id: due
        run: |
          slug="${{ inputs.slug }}"
          if [ -z "$slug" ]; then slug=$(python3 -m mech.schedule); fi
          if [ -z "$slug" ] && [ "${{ github.event_name }}" = "schedule" ] && [ ! -s data/schedule.json -o "$(cat data/schedule.json)" = "[]" ]; then
            [ "$(date -u +%H)" = "${{ vars.POST_HOUR || '17' }}" ] && slug="next"
          fi
          if [ -n "$slug" ] && [ -z "$IG_ACCESS_TOKEN" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "::warning::$slug is due but IG_ACCESS_TOKEN is not set: nothing posted (add the Instagram secrets)"; slug=""
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"; echo "due: ${slug:-nothing}"
      - name: the prerendered video, if there is one
        if: steps.due.outputs.slug != '' && steps.due.outputs.slug != 'next'
        run: |
          s="${{ steps.due.outputs.slug }}"
          mkdir -p "out/$s" && gh release download "reel-$s" -D "out/$s" --clobber || echo "not prerendered: it will be made now"
          ls -la "out/$s" || true
      - if: steps.due.outputs.slug != ''
        uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - if: steps.due.outputs.slug != ''
        uses: Swatinem/rust-cache@v2
      - if: steps.due.outputs.slug != ''
        uses: oven-sh/setup-bun@v2
      - if: steps.due.outputs.slug != ''
        uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: mech/requirements.txt }
      - if: steps.due.outputs.slug != ''
        name: tools
        run: |
          if [ -f "out/${{ steps.due.outputs.slug }}/reel.mp4" ]; then pip install -q -r mech/requirements.txt; else mech/ci/setup-tools.sh; fi
      - if: steps.due.outputs.slug != ''
        name: post
        run: |
          s="${{ steps.due.outputs.slug }}"; [ "$s" = "next" ] && s=""
          args="$s"; [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          python3 -m mech publish $args
      - if: always() && steps.due.outputs.slug != ''
        uses: actions/upload-artifact@v4
        with: { name: reel, path: "out/*/*", retention-days: 14, if-no-files-found: ignore }
      - if: success() && steps.due.outputs.slug != '' && inputs.dry_run != true
        run: |
          mech/ci/commit-state.sh "posted a reel"
          mech/ci/queue-issue.sh
