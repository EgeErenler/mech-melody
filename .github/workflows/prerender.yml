name: prerender
# Film scheduled songs ahead of time, so posting takes seconds. Runs when data/schedule.json or a
# song changes; each song not yet rendered (no "reel-<slug>" release) is built and filmed in
# parallel and kept as a release (reel.mp4, cover.jpg, studio.json).
on:
  push:
    branches: [main]
    paths: ["data/schedule.json", "songs/**", "mech/build.py", "mech/instruments.py", "src/studio/**"]
  workflow_dispatch:
    inputs:
      force: { description: "render again even if a release exists", type: boolean, default: false }
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { slugs: "${{ steps.p.outputs.slugs }}" }
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: p
        run: |
          todo=()
          for s in $(python3 -c "import json; print(' '.join(x['slug'] for x in json.load(open('data/schedule.json'))))"); do
            posted=$(python3 -c "import json,sys; print(any(p['slug']=='$s' for p in json.load(open('data/published.json'))))")
            [ "$posted" = "True" ] && continue
            # the commit that last changed anything this reel is made from; a release made from an older one is redone
            rev=$(git log -1 --format=%h -- src/studio src/ui/render src/show mech/build.py mech/instruments.py mech/render_video.ts mech/lang.py "songs/$s")
            have=$(gh release view "reel-$s" --json body -q .body 2>/dev/null | sed -n 's/^rev: //p')
            if [ "${{ inputs.force }}" != "true" ] && [ "$have" = "$rev" ]; then continue; fi
            todo+=("\"$s\"")
          done
          echo "slugs=[$(IFS=,; echo "${todo[*]}")]" >> "$GITHUB_OUTPUT"; echo "to render: ${todo[*]:-none}"
  render:
    needs: plan
    if: needs.plan.outputs.slugs != '[]'
    strategy: { matrix: { slug: "${{ fromJSON(needs.plan.outputs.slugs) }}" }, fail-fast: false }
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}", GH_TOKEN: "${{ github.token }}", CHROME_PATH: /usr/bin/google-chrome }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: mech/requirements.txt }
      - run: mech/ci/setup-tools.sh
      - run: python3 -m mech prerender "${{ matrix.slug }}"
      - name: keep it
        run: |
          s="${{ matrix.slug }}"
          gh release delete "reel-$s" -y --cleanup-tag 2>/dev/null || true
          rev=$(git log -1 --format=%h -- src/studio src/ui/render src/show mech/build.py mech/instruments.py mech/render_video.ts mech/lang.py "songs/$s")
          gh release create "reel-$s" "out/$s/reel.mp4" "out/$s/cover.jpg" "out/$s/studio.json" --title "Reel: $s" --notes "Prerendered for Instagram.
          rev: $rev" --latest=false
